<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0E14"/>
      <stop offset="100%" stop-color="#0D1420"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1B2433" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0E14" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0A0E14" stop-opacity="0.9"/>
    </linearGradient>
    <path id="circuitPath" d="M -50 40 H 250 V 120 H 550 V 60 H 850 V 200 H 1050" fill="none"/>
  </defs>

  <rect width="1000" height="300" fill="url(#bg)"/>
  <rect width="1000" height="300" fill="url(#grid)" opacity="0.55"/>

  <!-- ambient circuit line + flowing signal -->
  <use href="#circuitPath" stroke="#16323A" stroke-width="1.5"/>
  <circle r="3.2" fill="#00D9A3">
    <animateMotion dur="7s" repeatCount="indefinite">
      <mpath href="#circuitPath"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" dur="7s" repeatCount="indefinite"/>
  </circle>

  <rect width="1000" height="300" fill="url(#fade)"/>

  <!-- terminal window -->
  <g transform="translate(60,45)">
    <rect width="880" height="210" rx="10" fill="#0F1620" stroke="#1F2937" stroke-width="1.5"/>
    <rect width="880" height="32" rx="10" fill="#131C29"/>
    <rect y="22" width="880" height="10" fill="#131C29"/>
    <circle cx="22" cy="16" r="6" fill="#FF5F56"/>
    <circle cx="44" cy="16" r="6" fill="#FFBD2E"/>
    <circle cx="66" cy="16" r="6" fill="#27C93F"/>
    <text x="440" y="21" fill="#6B7280" font-size="13" text-anchor="middle">om@backend  ~  zsh</text>

    <g font-size="16" fill="#E6E6E6">
      <text x="28" y="66" fill="#00D9A3">
        <tspan opacity="0"><animate attributeName="opacity" to="1" begin="0.2s" dur="0.01s" fill="freeze"/></tspan>&gt; whoami
      </text>
      <text x="28" y="66" opacity="0">
        <animate attributeName="opacity" to="1" begin="0.2s" dur="0.01s" fill="freeze"/>
        <tspan fill="#00D9A3">&gt; whoami</tspan>
      </text>
      <text x="28" y="92" opacity="0" font-size="18" font-weight="bold">
        <animate attributeName="opacity" to="1" begin="0.9s" dur="0.3s" fill="freeze"/>
        Om — Backend-Focused Full-Stack Developer
      </text>

      <text x="28" y="128" opacity="0" fill="#00D9A3">
        <animate attributeName="opacity" to="1" begin="1.8s" dur="0.01s" fill="freeze"/>
        &gt; status --internship
      </text>
      <text x="28" y="154" opacity="0" fill="#FFB86B">
        <animate attributeName="opacity" to="1" begin="2.5s" dur="0.3s" fill="freeze"/>
        SEEKING: Software Engineering Internships
      </text>

      <text x="28" y="190" opacity="0" fill="#00D9A3">
        <animate attributeName="opacity" to="1" begin="3.4s" dur="0.01s" fill="freeze"/>
        &gt; ./run_projects.sh
      </text>
      <text x="28" y="212" opacity="0" font-size="14" fill="#9CA3AF">
        <animate attributeName="opacity" to="1" begin="4.0s" dur="0.3s" fill="freeze"/>
        <tspan fill="#27C93F">[OK]</tspan> Okane     — async payment backend · Node/Redis/BullMQ
      </text>

      <rect x="28" y="222" width="10" height="16" fill="#00D9A3" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.5;1" begin="4.4s" dur="1s" repeatCount="indefinite" fill="freeze"/>
      </rect>
    </g>
  </g>

  <text x="500" y="285" text-anchor="middle" font-size="12" fill="#3A4557">350+ LeetCode solved · rating ~1620 · B.E. CS (AI/ML), Rungta CET</text>
</svg>
