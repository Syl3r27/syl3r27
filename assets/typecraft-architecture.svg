<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace">
  <defs>
    <pattern id="g3" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#1B2433" stroke-width="1"/>
    </pattern>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#00D9A3"/>
    </marker>
  </defs>

  <rect width="900" height="300" fill="#0A0E14"/>
  <rect width="900" height="300" fill="url(#g3)" opacity="0.5"/>
  <text x="30" y="34" font-size="18" fill="#E6E6E6" font-weight="bold">TypeCraft — Real-Time Multiplayer Typing Platform</text>
  <text x="30" y="54" font-size="12" fill="#6B7280">Socket.io · Custom Input Engine · Dual-Mode Auth</text>

  <g font-size="13">
    <rect x="20" y="100" width="140" height="50" rx="8" fill="#111827" stroke="#2D3748"/>
    <text x="90" y="123" text-anchor="middle" fill="#E6E6E6">Player 1</text>
    <text x="90" y="139" text-anchor="middle" fill="#6B7280" font-size="10">keystroke stream</text>

    <rect x="20" y="180" width="140" height="50" rx="8" fill="#111827" stroke="#2D3748"/>
    <text x="90" y="203" text-anchor="middle" fill="#E6E6E6">Player 2</text>
    <text x="90" y="219" text-anchor="middle" fill="#6B7280" font-size="10">keystroke stream</text>

    <rect x="260" y="140" width="190" height="60" rx="8" fill="#111827" stroke="#00D9A3"/>
    <text x="355" y="165" text-anchor="middle" fill="#E6E6E6">Socket.io Server</text>
    <text x="355" y="182" text-anchor="middle" fill="#6B7280" font-size="10">low-latency broadcast</text>

    <rect x="550" y="90" width="160" height="50" rx="8" fill="#111827" stroke="#FFB86B"/>
    <text x="630" y="113" text-anchor="middle" fill="#E6E6E6">Room State</text>
    <text x="630" y="129" text-anchor="middle" fill="#6B7280" font-size="10">WPM / accuracy calc</text>

    <rect x="550" y="200" width="160" height="50" rx="8" fill="#111827" stroke="#2D3748"/>
    <text x="630" y="223" text-anchor="middle" fill="#E6E6E6">Auth</text>
    <text x="630" y="239" text-anchor="middle" fill="#6B7280" font-size="10">guest + account (dual-mode)</text>
  </g>

  <path d="M160 125 L260 160" fill="none" stroke="#2D3748" stroke-width="2" marker-end="url(#arrow3)"/>
  <path d="M160 205 L260 175" fill="none" stroke="#2D3748" stroke-width="2" marker-end="url(#arrow3)"/>
  <path d="M450 155 L550 120" fill="none" stroke="#2D3748" stroke-width="2" marker-end="url(#arrow3)"/>
  <path d="M450 185 L550 220" fill="none" stroke="#2D3748" stroke-width="2" marker-end="url(#arrow3)"/>

  <circle r="4" fill="#00D9A3">
    <animateMotion dur="2s" repeatCount="indefinite" path="M160 125 L260 160"/>
  </circle>
  <circle r="4" fill="#00D9A3">
    <animateMotion dur="2s" begin="0.3s" repeatCount="indefinite" path="M160 205 L260 175"/>
  </circle>
  <circle r="4" fill="#FFB86B">
    <animateMotion dur="2s" begin="0.6s" repeatCount="indefinite" path="M450 155 L550 120"/>
  </circle>
  <circle r="4" fill="#00D9A3">
    <animateMotion dur="2s" begin="0.9s" repeatCount="indefinite" path="M450 185 L550 220"/>
  </circle>

  <text x="870" y="285" text-anchor="end" font-size="10" fill="#3A4557">state synced across all connected clients in real time</text>
</svg>
