<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, 'SF Mono', Monaco, 'Courier New', monospace">
  <defs>
    <pattern id="g1" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#1B2433" stroke-width="1"/>
    </pattern>
    <marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#00D9A3"/>
    </marker>
    <path id="p1a" d="M140 70 H260" fill="none"/>
    <path id="p1b" d="M400 70 H520" fill="none"/>
    <path id="p1c" d="M620 70 H620 V150" fill="none"/>
    <path id="p1d" d="M620 190 L500 240" fill="none"/>
    <path id="p1e" d="M620 190 L740 240" fill="none"/>
  </defs>

  <rect width="900" height="320" fill="#0A0E14"/>
  <rect width="900" height="320" fill="url(#g1)" opacity="0.5"/>
  <text x="30" y="34" font-size="18" fill="#E6E6E6" font-weight="bold">Okane — Async Payment Processing Backend</text>
  <text x="30" y="54" font-size="12" fill="#6B7280">Node.js · TypeScript · Redis · BullMQ · Docker · CI/CD</text>

  <!-- nodes -->
  <g font-size="13">
    <rect x="20" y="90" width="120" height="50" rx="8" fill="#111827" stroke="#2D3748"/>
    <text x="80" y="120" text-anchor="middle" fill="#E6E6E6">Client</text>

    <rect x="260" y="90" width="140" height="50" rx="8" fill="#111827" stroke="#00D9A3"/>
    <text x="330" y="116" text-anchor="middle" fill="#E6E6E6">API Gateway</text>
    <text x="330" y="132" text-anchor="middle" fill="#6B7280" font-size="10">idempotency check</text>

    <rect x="520" y="90" width="140" height="50" rx="8" fill="#111827" stroke="#2D3748"/>
    <text x="590" y="116" text-anchor="middle" fill="#E6E6E6">Queue</text>
    <text x="590" y="132" text-anchor="middle" fill="#6B7280" font-size="10">BullMQ jobs</text>

    <rect x="520" y="170" width="140" height="50" rx="8" fill="#111827" stroke="#2D3748"/>
    <text x="590" y="196" text-anchor="middle" fill="#E6E6E6">Worker</text>
    <text x="590" y="212" text-anchor="middle" fill="#6B7280" font-size="10">payment processor</text>

    <rect x="400" y="240" width="150" height="55" rx="8" fill="#111827" stroke="#FFB86B"/>
    <text x="475" y="264" text-anchor="middle" fill="#E6E6E6">Redis</text>
    <text x="475" y="280" text-anchor="middle" fill="#6B7280" font-size="10">idempotency store</text>

    <rect x="670" y="240" width="150" height="55" rx="8" fill="#111827" stroke="#2D3748"/>
    <text x="745" y="264" text-anchor="middle" fill="#E6E6E6">PostgreSQL</text>
    <text x="745" y="280" text-anchor="middle" fill="#6B7280" font-size="10">transaction ledger</text>
  </g>

  <!-- connectors -->
  <path d="M140 115 H260" fill="none" stroke="#2D3748" stroke-width="2" marker-end="url(#arrow1)"/>
  <path d="M400 115 H520" fill="none" stroke="#2D3748" stroke-width="2" marker-end="url(#arrow1)"/>
  <path d="M590 140 V170" fill="none" stroke="#2D3748" stroke-width="2" marker-end="url(#arrow1)"/>
  <path d="M560 220 L500 240" fill="none" stroke="#2D3748" stroke-width="2" marker-end="url(#arrow1)"/>
  <path d="M640 220 L720 240" fill="none" stroke="#2D3748" stroke-width="2" marker-end="url(#arrow1)"/>

  <!-- animated flow dots -->
  <circle r="4" fill="#00D9A3">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M140 115 H260"/>
  </circle>
  <circle r="4" fill="#00D9A3">
    <animateMotion dur="2.5s" begin="0.4s" repeatCount="indefinite" path="M400 115 H520"/>
  </circle>
  <circle r="4" fill="#00D9A3">
    <animateMotion dur="2.5s" begin="0.8s" repeatCount="indefinite" path="M590 140 V170"/>
  </circle>
  <circle r="4" fill="#FFB86B">
    <animateMotion dur="2.5s" begin="1.2s" repeatCount="indefinite" path="M560 220 L500 240"/>
  </circle>
  <circle r="4" fill="#00D9A3">
    <animateMotion dur="2.5s" begin="1.2s" repeatCount="indefinite" path="M640 220 L720 240"/>
  </circle>

  <rect x="20" y="20" width="0" height="0"/>
  <text x="870" y="310" text-anchor="end" font-size="10" fill="#3A4557">containerized · Docker + CI/CD</text>
</svg>
